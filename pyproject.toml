[project]
name = "headroom"
version = "0.1.0"
description = "An LLM gateway and control plane: virtual keys, budgets, rate limits, caching, failover, and per-tenant cost metering."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pydantic>=2.7",
    "boto3>=1.35",
    # config/routing.yaml (Phase 1) and config/models.yaml with its dated price
    # schedules (Phase 3). YAML rather than JSON because both files are meant to be
    # read and edited by a human, and both earn their comments.
    "pyyaml>=6.0",
]

# The semantic cache's embedder (BAAI/bge-small-en-v1.5, CPU — BUILD_PLAN L6) is a
# heavy dependency (torch). It is optional so keyless CI and the default dev install
# stay light; Phase 5 onward installs `--extra embed`. torch is declared here (not
# just transitively via sentence-transformers) so the CPU index pin below binds it.
[project.optional-dependencies]
embed = ["sentence-transformers>=3.2", "torch>=2.2"]

# CPU-only torch: resolve torch from the PyTorch CPU wheel index instead of PyPI, so
# `--extra embed` installs ~200 MB of CPU wheels rather than ~5 GB of CUDA builds.
# Backline shipped this block commented out (its build sandbox could not reach
# download.pytorch.org); Headroom is built on a machine that can, so it is live from
# Phase 0 — see docs/DECISIONS.md H-005.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    # PyYAML ships no inline types, and `mypy --strict` will not take Any for an
    # answer on a config loader.
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["headroom"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ui", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["headroom", "tests", "conftest.py"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# boto3 and botocore ship no inline types and no py.typed marker. The alternative is
# `boto3-stubs[dynamodb]`, a large generated stub package pinned to an SDK version —
# for a surface of five DynamoDB calls, all of which cross the boundary through
# `headroom/db/dynamo.py` and are converted to typed records immediately (Phase 4).
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Keyless by default (BUILD_PLAN §0.2 invariant 4): `live` tests hit a real provider
# API and cost money. They are excluded from every default collection and run
# manually via `uv run pytest -m live`; a later -m on the command line overrides this.
addopts = '-m "not live"'
markers = [
    "live: hits a real provider API and costs money (needs a key; run manually with -m live)",
]
