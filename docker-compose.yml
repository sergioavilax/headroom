# Headroom's local stack: db (Postgres 16 + pgvector) + dynamodb (DynamoDB Local)
# + gateway (FastAPI). Every variable has a default, so a bare `docker compose up`
# works with no `.env`; compose reads `.env` automatically for overrides.
#
# Host ports deliberately sidestep the usual suspects — 5433 for Postgres, 8080 for
# the gateway, 8001 for DynamoDB Local — so the stack coexists with whatever else is
# already bound to 5432/8000 on a developer's machine (docs/DECISIONS.md H-006).
# Container-internal ports stay canonical.
#
# No secret appears in this file, ever (BUILD_PLAN §0.2 invariant 3). The AWS
# credentials below are DynamoDB Local's ignored dummies — it requires *some*
# credential to sign against and never validates it. Real provider keys live in the
# gitignored `.env` and are wired in by the phase that needs them.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-headroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-headroom}
      POSTGRES_DB: ${POSTGRES_DB:-headroom}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-headroom} -d ${POSTGRES_DB:-headroom}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Token buckets and budget reservations only (BUILD_PLAN L2). `-sharedDb` keeps
  # every credential looking at one dataset, so a table created by one process is
  # visible to the next; `-inMemory` makes the container disposable — the local
  # stack's DynamoDB state is never meant to survive a restart.
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb", "-port", "8000"]
    ports:
      - "${DYNAMODB_PORT:-8001}:8000"
    healthcheck:
      # An unsigned GET is a malformed DynamoDB request by definition, so a 400 is
      # the service answering — which is what "up" means for this container.
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ | grep -q 400",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-headroom}:${POSTGRES_PASSWORD:-headroom}@db:5432/${POSTGRES_DB:-headroom}
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # DynamoDB Local requires *a* credential to sign against and validates none of
      # it. Note the absence of a hyphen — it does parse the access key id out of the
      # SigV4 credential scope and rejects one containing `-` with an error that reads
      # exactly like a real AWS auth failure (docs/DECISIONS.md H-030).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      # Phase 4: the budget table. Created on first use here and in CI; created by
      # Terraform in Phase 9, where this same code finds it already there.
      HEADROOM_BUDGETS_TABLE: ${HEADROOM_BUDGETS_TABLE:-headroom_budgets}
      # Phase 4b: the token buckets. A second table rather than a second item shape in
      # the first one, because the two have opposite retention rules — a budget item
      # must never be garbage-collected, and a bucket item is *safe* to reap since an
      # absent bucket and a full one are the same state (docs/DECISIONS.md H-035).
      HEADROOM_BUCKETS_TABLE: ${HEADROOM_BUCKETS_TABLE:-headroom_buckets}
      # Phase 5: which model embeds a question for the semantic cache. Passed through
      # rather than defaulted here, so the *code's* default (BUILD_PLAN L6's
      # bge-small-en-v1.5) is the one thing to change if it ever changes.
      #
      # This image deliberately does NOT carry the `embed` extra — a ~200 MB torch
      # install in a container whose tenants all have caching disabled by default buys
      # nothing, and baking the weights is Phase 9's job (L6). So out of the box the
      # compose gateway does **exact** caching, and asking it for `semantic` answers
      # 503 naming the extra rather than silently falling back to something else
      # (docs/DECISIONS.md H-041's neighbour: there is no fallback, on purpose).
      # `HEADROOM_EMBEDDER=hashing` in `.env` gives a working semantic demo here with
      # no torch — real lexical similarity, and no ability to tell a paraphrase from a
      # near-miss, which is exactly why it is not the default.
      HEADROOM_EMBEDDER: ${HEADROOM_EMBEDDER:-}
      HEADROOM_LOG_LEVEL: ${HEADROOM_LOG_LEVEL:-INFO}
      # The root admin token (Phase 2), referenced from the host shell or the
      # gitignored `.env`, never valued here. Unset is a safe state: the admin API
      # answers 503 rather than opening itself (docs/DECISIONS.md H-019).
      HEADROOM_ADMIN_TOKEN: ${HEADROOM_ADMIN_TOKEN:-}
      # Real provider credentials and endpoints, *referenced* from the host shell or
      # the gitignored `.env` — never a literal value here (invariant 3), and never
      # defaulted to something that could work by accident. Unset means unset: the
      # gateway boots fine and only a request that needs the missing key fails, naming
      # it. Without these three lines the compose gateway can serve mock traffic and
      # nothing else, which would make the live smoke impossible through the container.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # NB: `localhost` in here is the *container*. A vLLM running on this machine is
      # reachable at host.docker.internal (mapped below for native Linux, built in on
      # Docker Desktop); one on another box wants its LAN address.
      #
      # Two of them since Phase 6 — one per 4090, ports 8010 and 8011 (docs/vllm.md) —
      # because `config/routing.yaml` chains vllm_a to vllm_b and a fallback nobody can
      # reach is not a fallback. The defaults here are the demo's addresses, so the
      # container needs no `.env` to run it.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8010}
      VLLM_B_BASE_URL: ${VLLM_B_BASE_URL:-http://host.docker.internal:8011}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The operator console (Phase 7) — the service §0.5 has said "later the ui" about since
  # Phase 0. It is a client of `/admin/*` and nothing else: it has no database URL, no
  # DynamoDB endpoint, and no way to read either.
  #
  # ── It is handed no secret at all ──────────────────────────────────────────────
  # Not even by reference. The root admin token is typed into the console at runtime and
  # exchanged for an httpOnly session cookie held by *its* server process
  # (docs/DECISIONS.md H-055), so there is no `HEADROOM_ADMIN_TOKEN` line here to leak,
  # to forget, or to bake into a bundle — one fewer place invariant 3 can be violated.
  #
  # Port 3001, not 3000: Backline's UI holds 3000 on this machine, and P8.H2 needs both
  # stacks up at once (H-006's argument, one service along).
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      # Inside the compose network the gateway is a service name. An operator running the
      # gateway on the *host* — which the two-GPU kill demo does, so that localhost:8010
      # and :8011 mean the vLLM instances — sets this to
      # http://host.docker.internal:8090 in `.env` instead.
      HEADROOM_GATEWAY_URL: ${HEADROOM_GATEWAY_URL:-http://gateway:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${UI_PORT:-3001}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # Liveness only, and deliberately not a probe of the gateway: compose already waits
      # for the gateway to be healthy, and a console that reported its upstream's health as
      # its own would take a working container down during a gateway restart.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  dbdata:
