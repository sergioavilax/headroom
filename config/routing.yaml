# Headroom's routing table: which providers exist, and who serves which model.
#
# Read once at startup (headroom/core/config.py). Point HEADROOM_ROUTING_CONFIG at
# another file to run a gateway with a different table — that is how the test suite
# gets a mock-only gateway without editing this one.
#
# ── No secret ever appears in this file ────────────────────────────────────────
# A provider names the *environment variable* holding its credential, never the
# credential (BUILD_PLAN §0.2 invariant 3). There is deliberately no schema field a
# key could be written into, so the rule is enforced by the loader rather than by
# whoever reviews the diff. Locally the values live in the gitignored `.env`.
#
# ── Matching ───────────────────────────────────────────────────────────────────
# A model is served by the rule with the longest matching prefix, so a specific rule
# can carve one model out of a family without rewriting the family's rule. The empty
# prefix ("") matches everything and is therefore the catch-all.
#
# ── Failover chains (Phase 6) ──────────────────────────────────────────────────
# A rule may name `fallbacks:` — same-dialect alternates, tried in order when the
# primary cannot serve. Routes are per dialect, so a chain is same-dialect by
# construction (BUILD_PLAN L4); the gateway *also* refuses to start if a chain crosses
# one, because "by construction" is not a thing a config file can be trusted with.
#
# Failover is opt-in and per route. A rule with no `fallbacks` and no `max_attempts`
# makes exactly one attempt, with no backoff and no circuit-breaker interference —
# which is why adding this feature changed nothing for `mock-` and `claude-` below.
#
# `max_attempts:` (optional, 1..5) is how a *single*-provider route asks to be retried
# rather than abandoned: above the chain length the attempt sequence wraps, so
# `max_attempts: 3` on a one-provider rule means a, a, a, and on a two-provider rule
# means a, b, a — every fresh candidate before any repeat.

providers:
  # Keyless, deterministic, fault-injectable — every test in the project runs on it,
  # and it is routable in the shipped config on purpose: `make up` plus one curl at a
  # `mock-` model is a working end-to-end demo of the whole path with no key, no
  # network, and no spend. Phase 2's key scopes can restrict who may reach it.
  mock:
    kind: mock

  # A second mock, so the *keyless* demo has a chain too. `make up` plus two curls now
  # shows a failover end to end — with no key, no network, no GPU, and no spend — which
  # is the same argument that put `mock` in this file at all. A request that injects no
  # fault never reaches it, so nothing about the Phase 1–5 demo changed.
  mock_fallback:
    kind: mock

  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY

  # The operator's two vLLM instances (BUILD_PLAN L5) — one per 4090, deliberately two
  # single-GPU servers rather than one tensor-parallel pair, and the reason Phase 6's
  # chaos demo costs $0.00: kill one container, watch traffic move to the other card.
  #
  # The topology is documented and VERIFIED in docs/vllm.md: instance A on host port
  # 8010, instance B on 8011, identical launch flags, pinned to a card each with
  # `--gpus all` plus `CUDA_VISIBLE_DEVICES=<UUID>`.
  #
  # Endpoints are per-machine facts, so they come from the environment; the `base_url`
  # beneath each is the fallback when the variable is unset. Either spelling of the URL
  # works — with or without a trailing /v1 (docs/DECISIONS.md H-011).
  vllm_a:
    kind: openai_compat
    base_url_env: VLLM_BASE_URL
    base_url: http://localhost:8010

  vllm_b:
    kind: openai_compat
    base_url_env: VLLM_B_BASE_URL
    base_url: http://localhost:8011

routes:
  anthropic:
    - prefix: "mock-"
      provider: mock
      fallbacks: [mock_fallback]
    - prefix: "claude-"
      provider: anthropic

  openai:
    - prefix: "mock-"
      provider: mock
      fallbacks: [mock_fallback]
    # The kill demo, as configuration. A request served by vllm_a when vllm_a is up;
    # by vllm_b, with `failover_hops: 1` on its ledger row, the moment it is not.
    - prefix: ""
      provider: vllm_a
      fallbacks: [vllm_b]
