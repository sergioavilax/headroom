# Fully keyless CI (BUILD_PLAN §0.2 invariant 4): no secret is read by any job, so
# forks and every PR run the same way the maintainer does. Live provider calls are
# opt-in locally (`pytest -m live`) and never happen here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The compose file is a deliverable; a typo in it should fail here, not on the
      # operator's machine.
      - name: docker compose config is valid
        run: docker compose config --quiet

  test:
    name: pytest (postgres + dynamodb-local service containers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: headroom
          POSTGRES_PASSWORD: headroom
          POSTGRES_DB: headroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U headroom -d headroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Default CMD is `-jar DynamoDBLocal.jar -inMemory` on port 8000. Service
      # containers cannot override CMD, so the readiness proof is the explicit wait
      # step below rather than a --health-cmd.
      dynamodb:
        image: amazon/dynamodb-local:3.1.0
        ports:
          - 8001:8000
    env:
      DATABASE_URL: postgresql://headroom:headroom@localhost:5432/headroom
      DYNAMODB_ENDPOINT_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/ || true)
            if [ "$code" = "400" ]; then
              echo "dynamodb-local answering (HTTP 400 to an unsigned GET)"
              exit 0
            fi
            sleep 1
          done
          echo "dynamodb-local never answered"
          exit 1
      # The service-backed tests must actually run here — a silent skip would make
      # this job a liar about the containers. Since Phase 2 that includes the whole
      # Postgres half of the TenantStore contract suite, which applies `migrations/`
      # itself, so the schema is proved before the step below re-runs it; since Phase 4
      # it also includes the DynamoDB half of the BudgetStore contract suite and the
      # D-019 stampede, and since Phase 4b the RateLimitStore contract suite and the
      # rate-limit hammer with its three sabotages — the tests in this repo that
      # *cannot* run against an in-memory double. Phase 6's chaos suite runs here too
      # and needs no service at all, which is the point of it: the failover matrix, the
      # splice sabotage, and three fault intensities against the mock chain are fully
      # keyless, so BUILD_PLAN §P6's "chaos suite green in CI" is a property of every
      # pull request rather than of a machine with two GPUs. Under H-012,
      # `DYNAMODB_ENDPOINT_URL` being set explicitly
      # above means an unreachable container fails these tests rather than skipping
      # them. No AWS credential is set anywhere: the gateway supplies its own dummy
      # when — and only when — an emulator endpoint is configured.
      - run: uv run pytest -v
      - name: Migrations apply, and applying them twice is a no-op
        run: |
          uv run python -m headroom.db.migrate
          uv run python -m headroom.db.migrate | tee /tmp/second.txt
          grep -q "up to date" /tmp/second.txt

  # Phase 7. Three checks in one job because they share an `npm ci`: eslint, `tsc
  # --noEmit`, and the console's unit tests — which run on Node's own test runner with
  # native TypeScript stripping, so the dashboard's test layer costs zero dependencies.
  # `next build` is proved here too, and it is the interesting half: the console reaches
  # no gateway, no database, and no network at build time, so this job needs no services
  # and no secrets. A build that had quietly grown a dependency on a running backend would
  # fail here rather than on somebody else's machine.
  ui:
    name: ui lint + typecheck + unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The browser smoke BUILD_PLAN §P7's gate asks for, kept hermetic: a Node stub of the
  # gateway's `/admin/*` surface and the console's own standalone server, and nothing
  # else — no compose stack, no Postgres, no DynamoDB, no provider, no key (invariant 4).
  # Chromium only, and its own job so the suite above is not held up by a browser
  # download.
  ui-e2e:
    name: ui browser smoke (chromium, stub gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  # Phases 9 and 10. Three things that can only break outside Python, all keyless and all
  # cheap: the Terraform parses, the rollup Lambda's package assembles, and the Helm chart
  # lints and renders into manifests a Kubernetes API server would accept. None touches an
  # AWS account and none needs a cluster — `terraform init -backend=false` fetches
  # providers from the registry and nothing else, `validate` reads no data source, and
  # `helm template` is a text transformation.
  #
  # Together with `tests/test_deploy_aws.py` and `tests/test_deploy_k8s.py` — which hold
  # the `.tf` files, the chart, and the eksctl config to the constants the gateway
  # actually uses — this is the whole of what CI can honestly say about a deployment it
  # will never perform: invariant 2 gives every apply, every `eksctl` and every
  # `helm install` to the human.
  deploy:
    name: terraform validates, the Lambda packages, and the chart renders
    runs-on: ubuntu-latest
    env:
      # The version kubeconform validates against. Not `latest`: a schema set from a
      # newer Kubernetes accepts fields the chart's own `kubeVersion` floor does not
      # promise are there, so the check would drift more permissive without anyone
      # deciding to. Kept in step with the Makefile's `KUBE_VERSION`.
      KUBE_VERSION: 1.31.0
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # v4, not v3: v3 targets Node 20 and the runner forces it onto 24 with a deprecation
      # annotation. The same class of thing Phase 0 fixed in-branch for `checkout` and
      # `setup-uv`, and worth fixing for the same reason — an annotation nobody acts on is
      # an annotation nobody reads.
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          # Without this the action wraps `terraform` in a script that swallows the exit
          # code, and `make tf-check` would pass on a file that does not parse.
          terraform_wrapper: false
      - run: uv sync --frozen
      # The artifact Terraform's `archive_file` zips. Built here as well as on the
      # operator's machine, so a change that breaks the packaging — a handler that grows
      # an import of fastapi, an asyncpg with no wheel for the runtime — fails on the pull
      # request rather than at the apply.
      - run: make lambda-build
      - run: make tf-check

      # Phase 10. `helm lint` catches a chart that is not a chart; `helm template` catches
      # a template that does not render, including the two guards that are supposed to
      # refuse — a LoadBalancer with no source ranges, and a tailscale egress proxy with
      # nowhere to forward to. `kubeconform` then checks the rendered manifests against
      # the Kubernetes API schemas, which is the part `helm lint` does not do at all: a
      # `maxUnavaialble` typo renders perfectly and is silently ignored by a real cluster.
      # v5, not v4.3.1: v4 targets Node 20 and the runner forces it onto 24 with a
      # deprecation annotation. Exactly what Phase 9 fixed in-branch for
      # `setup-terraform`, and Phase 0 for `checkout` and `setup-uv` — an annotation
      # nobody acts on is an annotation nobody reads.
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.19.0
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - run: make helm-check KUBE_VERSION=${{ env.KUBE_VERSION }}
      # The two refusals, asserted as refusals. A guard that stopped guarding would
      # otherwise be invisible: the chart would render, install, and publish an admin API
      # to 0.0.0.0/0 with nothing red anywhere.
      - name: The chart refuses to publish a load balancer to everyone
        run: |
          if helm template headroom deploy/k8s/headroom \
               --set gateway.service.type=LoadBalancer >/dev/null 2>&1; then
            echo "a LoadBalancer rendered with no loadBalancerSourceRanges"
            exit 1
          fi
          if helm template headroom deploy/k8s/headroom \
               --set vllm.enabled=true >/dev/null 2>&1; then
            echo "the tailscale egress proxy rendered with no targetIP"
            exit 1
          fi
          echo "both guards fired"

  image:
    name: gateway and ui images build and serve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The default build, without `WITH_EMBED=1`. The deploy image adds the `embed`
      # extra and bakes bge-small's weights — 3.81 GB unpacked — which is a multi-gigabyte
      # download on every CI run for a variant only the operator's `docker push` uses.
      # It is built and smoked by hand instead, and the phase log records that run.
      - run: docker build -t headroom:ci .
      - name: Smoke /healthz in the built image
        run: |
          docker run -d --name headroom-ci -p 8000:8000 headroom:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz | grep -q '"status":"ok"'; then
              echo "gateway healthy"
              exit 0
            fi
            sleep 1
          done
          echo "gateway never became healthy"
          docker logs headroom-ci
          exit 1
      - name: Remove the smoke container
        if: always()
        run: docker rm -f headroom-ci || true

      # The console's runtime image, built and smoked the same way. It carries no
      # secret and needs no gateway to answer `/api/healthz` — which is what makes it
      # safe for compose to gate on (the console's health is its own, never its
      # upstream's).
      - run: docker build -t headroom-ui:ci ./ui
      - name: Smoke /api/healthz in the built console image
        run: |
          docker run -d --name headroom-ui-ci -p 3001:3000 headroom-ui:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/healthz | grep -q '"status":"ok"'; then
              echo "console healthy"
              exit 0
            fi
            sleep 1
          done
          echo "console never became healthy"
          docker logs headroom-ui-ci
          exit 1
      - name: Remove the console smoke container
        if: always()
        run: docker rm -f headroom-ui-ci || true
